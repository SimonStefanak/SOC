{% extends "books/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="auth">
  <div class="container">
    <h1 class="auth__title">Log in</h1>
    {% if form.errors %}<p class="form-error">Wrong username or password.</p>{% endif %}
    <form method="post" class="auth__form">
      {% csrf_token %}
      <label for="id_username">Username</label>
      <input type="text" name="username" id="id_username" autocomplete="username" autofocus required>
      <label for="id_password">Password</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" required>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn-gold">Log in</button>
    </form>
  </div>
</section>
{% endblock %}
