{% extends "books/base.html" %}
{% block title %}Log in{% endblock %}

{% block content %}
<section class="auth">
  <form class="auth__form" method="post" action="{% url 'login' %}" novalidate>
    {% csrf_token %}
    <h1 class="auth__title">Log in</h1>

    {% if form.errors %}
    <p class="form-error" role="alert">That username and password don't match. Try again.</p>
    {% endif %}

    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" value="{{ form.username.value|default_if_none:'' }}"
             autocomplete="username" required{% if not form.username.value %} autofocus{% endif %}{% if form.errors %} aria-invalid="true"{% endif %}>
    </div>

    <div class="field">
      <div class="field__row">
        <label for="password">Password</label>
        <!-- Password reset isn't built yet: this link deliberately goes nowhere. -->
        <a class="field__aside" href="#" role="button" aria-disabled="true" title="Coming soon" onclick="return false;">Forgot password?</a>
      </div>
      <input type="password" id="password" name="password" autocomplete="current-password" required
             {% if form.username.value %}autofocus{% endif %}{% if form.errors %} aria-invalid="true"{% endif %}>
    </div>

    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn-gold auth__submit">Log in</button>

    <p class="auth__alt">No account? <a href="{% url 'register' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Create one</a></p>
  </form>
</section>
{% endblock %}
